name: Computer Use MVP

on:
  push:
    branches:
      - feat/computer-use-mvp
  pull_request:
    paths:
      - 'src/computer-use/**'
      - 'src/tools/computer*'
      - 'src/tools/schemas.ts'
      - 'src/server.ts'
      - 'test/test-computer-use.js'
      - 'package.json'
      - '.github/workflows/computer-use.yml'

jobs:
  headless-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Build TypeScript and bundled GUI bridge
        run: npm run build
      - name: Check Python bridge syntax (no GUI required)
        run: python3 -m py_compile src/computer-use/bridge.py
      - name: Run Computer Use mocked and MCP protocol tests
        run: node --test test/test-computer-use.js test/test-computer-mcp.js
